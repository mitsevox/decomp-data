name: Deploy

# Every publish is a push to main. Pushes made with a GitHub App token start this workflow;
# while one deploy runs, newer pushes replace each other in the single pending slot, so a burst of
# merges becomes a couple of deploys that each publish the branch tip.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      # Covers are committed full size; the site shows a 360px-wide thumbnail generated here,
      # so nobody makes thumbnails by hand and the full cover stays the single source.
      - name: Generate cover thumbnails
        run: |
          python3 -m pip install --quiet pillow==11.0.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for cover in Path('data').glob('*/cover.webp'):
              image = Image.open(cover)
              image.thumbnail((360, 100000))
              image.save(cover.with_name('cover-thumb.webp'), 'WEBP', quality=82)
              print(cover.parent.name, image.size)
          PY
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
